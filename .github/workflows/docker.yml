name: Build and Push Docker Image

# Builds the scraper image and pushes it to GitHub Container Registry (ghcr.io).
# Portainer then pulls `ghcr.io/<username>/thaqlain-scraper:latest` — no need
# to upload source files to the server.
#
# Builds for BOTH linux/amd64 and linux/arm64 so it runs on any server
# (including ARM cloud VMs like AWS Graviton, Oracle Ampere, Raspberry Pi).

on:
  push:
    branches: [main, master]
    paths:
      - "scrape_and_push.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/thaqlain-scraper

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} (amd64 + arm64)"

version: "3.8"

# Thaqlain Scraper — Portainer Stack
#
# Only the scraper runs on Portainer now. The Worker handles push notifications
# natively using the standard `web-push` npm library (no Python sidecar needed).
#
# Env vars (set in Portainer):
#   WORKER_URL              — your Cloudflare Worker URL
#   WORKER_INGEST_SECRET    — shared secret for the API

services:
  scraper:
    image: ghcr.io/collaboration786/thaqlain-scraper:latest
    container_name: thaqlain-scraper
    restart: "no"
    environment:
      - WORKER_URL=${WORKER_URL}
      - WORKER_INGEST_SECRET=${WORKER_INGEST_SECRET}
    volumes:
      - ./logs:/app/logs

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: thaqlain-scheduler
    command: daemon --docker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-run.thaqlain-scraper.schedule: "@daily"
      ofelia.job-run.thaqlain-scraper.image: "ghcr.io/collaboration786/thaqlain-scraper:latest"
      ofelia.job-run.thaqlain-scraper.command: "python3 scrape_and_push.py"
    depends_on:
      - scraper

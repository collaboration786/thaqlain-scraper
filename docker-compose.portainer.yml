version: "3.8"

# Thaqlain Calendar Scraper — Portainer Stack (pulls pre-built image from registry).
#
# This compose file pulls the multi-arch image from GitHub Container Registry.
# Just paste this into Portainer's Stack editor and set the environment vars.
#
# Image: ghcr.io/<your-github-username>/thaqlain-scraper:latest
# (Auto-built by GitHub Actions for linux/amd64 AND linux/arm64)

services:
  # The scraper runs ONCE (scrape 13 months → push to Worker → exit).
  # Ofelia (the scheduler) starts it daily via `job-run`.
  scraper:
    image: ghcr.io/collaboration786/thaqlain-scraper:latest
    container_name: thaqlain-scraper
    restart: "no"
    environment:
      - WORKER_URL=${WORKER_URL}
      - WORKER_INGEST_SECRET=${WORKER_INGEST_SECRET}
    volumes:
      - scraper-logs:/app/logs
      - scraper-data:/app/data

  # Ofelia scheduler — reads job labels via Docker API (`--docker` flag).
  # The `job-run` labels go HERE (on the scheduler), not on the scraper,
  # because job-run starts a NEW container from the specified image.
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: thaqlain-scheduler
    command: daemon --docker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      # Ofelia will start a fresh scraper container daily at midnight.
      ofelia.job-run.thaqlain-scraper.schedule: "@daily"
      ofelia.job-run.thaqlain-scraper.image: "ghcr.io/collaboration786/thaqlain-scraper:latest"
      ofelia.job-run.thaqlain-scraper.command: "python3 scrape_and_push.py"
    depends_on:
      - scraper

volumes:
  scraper-logs:
  scraper-data:
